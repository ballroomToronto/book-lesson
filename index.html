<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slavik Chichugin — Latin &amp; Ballroom in Toronto</title>
<meta name="description" content="Prices and lesson requests for Slavik Chichugin, Latin and ballroom coach in Toronto: trial lessons, private lessons, online lessons and wedding choreography.">
<meta name="theme-color" content="#17110c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17110c;
    --panel: #211912;
    --ink: #f1e9d6;
    --bronze: #c9a064;
    --muted: #c0b59e;
    --line: #3d3125;
    --card: #f4eddd;
    --card-ink: #1c140d;
    --card-muted: #4a4034;
    --field: #fffaf0;
    --field-line: #857860;
    --err: #8f1d12;
    --serif: "Cormorant Garamond", "Times New Roman", Georgia, serif;
    --sans: "Jost", "Helvetica Neue", Arial, system-ui, sans-serif;
    --gutter: clamp(20px, 4vw, 56px);
    --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 80px; background: var(--bg); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-weight: 400; font-size: 17px; line-height: 1.6;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--bronze); outline-offset: 3px; }
  [hidden] { display: none !important; }
